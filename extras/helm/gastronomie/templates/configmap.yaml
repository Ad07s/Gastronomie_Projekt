# "." am Anfang bezeichnet den Top-Level Namensraum bei Helm

# https://github.com/kubernetes/enhancements/blob/master/keps/sig-cli/5295-kyaml/README.md
# https://kubernetes.io/blog/2025/08/27/kubernetes-v1-34-release/#alpha-support-for-kyaml-a-kubernetes-dialect-of-yaml

---
{
  apiVersion: "v1",
  # https://kubernetes.io/docs/concepts/configuration/configmap
  kind: "ConfigMap",
  metadata: {
    name: "{{ include "gastronomie.fullname" . }}",
    namespace: "{{ .Values.namespace }}",
  },
  data: {
    # Key-Value-Paare (hier: fuer die Umgebungsvariable)
    TZ: "Europe/Berlin",
    LANG: "de_DE.utf8",
    SPRING_PROFILES_DEFAULT: "{{ .Values.profile }}",
    SPRING_PROFILES_ACTIVE: "{{ .Values.profile }}",
    SERVER_TOMCAT_BASEDIR: "/tmp",
  },
}
