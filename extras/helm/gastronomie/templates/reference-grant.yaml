# Gateway API erlaubt per Default nur Referenzen in demselben Namespace
# Gateway API mit z.B.
# - Traefik ist im Namespace "traefik"
# - kgateway ist im Namespace "kgateway-system"

apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-route
  namespace: {{ .Values.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: traefik
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kgateway-system
  to:
    - group: ""
      kind: Service
      name: {{ include "gastronomie.fullname" . }}
