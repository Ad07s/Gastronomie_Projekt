# Aufruf:   docker compose up
#           docker compose exec db bash -c "cp /init/tls/* /var/lib/postgresql/18/data"
#           docker compose down

# https://github.com/compose-spec/compose-spec/blob/master/schema/compose-spec.json

services:
  db:
    # https://github.com/docker-library/postgres/blob/master/18/trixie/Dockerfile
    image: dhi.io/postgres:18.3-debian13
    ports:
      - published: 5432
        target: 5432
    # https://www.postgresql.org/docs/current/ssl-tcp.html
    # https://dev.to/danvixent/how-to-setup-postgresql-with-ssl-inside-a-docker-container-5f3
    # https://gist.github.com/mrw34/c97bb03ea1054afb551886ffc8b63c3b
    # https://stackoverflow.com/questions/55072221/deploying-postgresql-docker-with-ssl-certificate-and-key-with-volumes
    # https://www.docker.com/blog/docker-best-practices-choosing-between-run-cmd-and-entrypoint
    # ggf. "-c shared_buffers=64MB" statt 128 MB (default bei PostgreSQL 18)
    # ggf. "-c timezone='Europe/Berlin'" (default bei PostgreSQL 18)
    # ggf. "-c max_connections=10" statt 100
    # default:   $PGDATA/server.crt und $PGDATA/server.key
    command: ["-c", "ssl=on"]
    volumes:
      - pg_data:/var/lib/postgresql/18/data
      - pg_tablespace:/tablespace
      - pg_init:/init:ro
      # fuer Unix-Socket: .s.PGSQL.5432.lock
      #- type: bind
      #  source: C:/Zimmermann/volumes/postgres/run
      #  target: /var/run/postgresql
    # https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables
    environment:
      TZ: Europe/Berlin
      # https://www.postgresql.org/docs/current/libpq-envars.html
      # default bei PostgreSQL 18
      #PGTZ: Europe/Berlin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
      # siehe /var/lib/postgresql/18/data/pg_hba.conf
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    # /run/secrets
    secrets: [db_password]
      # "secrets sind in einem read-only Dateisystem, d.h. chown ist nicht möglich, Owner "root" und Zugriffsrechte 777
      #- source: pg_cert
      #  target: /tls/server.crt
      #- source: pg_key
      #  target: /tls/server.key
    networks: [acme-network]
    user: "postgres:postgres"
    hostname: postgres
    container_name: postgres
    # https://docs.docker.com/reference/compose-file/services/#cap_drop
    # https://man7.org/linux/man-pages/man7/capabilities.7.html
    cap_drop: [ALL]
    # https://docs.docker.com/reference/compose-file/services/#cap_add
    #cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, NET_BIND_SERVICE, CAP_FOWNER]
    healthcheck:
      test: [CMD, pg_isready, --username=postgres]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 5s
    restart: unless-stopped
    # https://docs.docker.com/compose/compose-file/deploy
    deploy:
      # https://docs.docker.com/compose/compose-file/deploy/#resources
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 512M

  # ------------------------------------------------------------------------------------
  # p g a d m i n
  # ------------------------------------------------------------------------------------
  # http://localhost:8888 mit Emailadresse "pgadmin@acme.com" und Passwort "p"
  # https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
  pgadmin:
    image: dpage/pgadmin4:9.15.0
    depends_on: [db]
    ports:
      - published: 8888
        target: 80
    volumes:
      - type: bind
        source: /Users/abdullah/docker_volumes/volumes/pgadmin
        # https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
        # enthaelt u.a. pgadmin4.db als SQLite-DB mit z.B. der Tabelle "user"
        target: /var/lib/pgadmin
    environment:
      # https://www.pgadmin.org/docs/pgadmin4/latest/container_deployment.html
      PGADMIN_DEFAULT_EMAIL: pgadmin@acme.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/db_password
      # /certs/server.cert und /certs/server.key für TLS
      #PGADMIN_ENABLE_TLS: true
      PGADMIN_DISABLE_POSTFIX: true
      GUNICORN_ACCESS_LOGFILE: /var/lib/pgadmin/pgadmin.log
    secrets: [db_password]
    networks: [acme-network]
    user: "pgadmin:5050"
    hostname: pgadmin
    container_name: pgadmin
    # https://docs.docker.com/compose/compose-file/compose-file-v3/#cap_add-cap_drop
    cap_drop: [ALL]
    # https://man7.org/linux/man-pages/man7/capabilities.7.html
    # setgid
    # find "/var/lib/..."
    # find "/var/spool/..."
    # /venv/bin/python3
    # /venv/bin/gunicorn
    cap_add: [CHOWN, SETGID, SETUID, DAC_OVERRIDE, NET_BIND_SERVICE]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G

secrets:
  db_password:
    file: ./password.txt

volumes:
  pg_data:
    name: pg_data
    external: true
  pg_tablespace:
    name: pg_tablespace
    external: true
  pg_init:
    name: pg_init
    external: true

networks:
  acme-network:
    name: acme-network
